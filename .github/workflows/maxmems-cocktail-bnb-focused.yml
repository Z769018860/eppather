name: MaxMEMS cocktail BnB focused

concurrency:
  group: maxmems-cocktail-bnb-focused-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-bnb-focused
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'C/syntax/SyntaxNamePrinter.h'
      - 'C/syntax/EpatRunner.cpp'
      - 'C/syntax/EpatRunner.h'
      - 'tools/maxmems_witness_experiment.py'
      - '.github/workflows/maxmems-cocktail-bnb-focused.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build_cocktail -DANALYSIS_BACKEND=epat++

      - name: Build cnip
        run: cmake --build build_cocktail --target cnip -j2

      - name: Validate upper-bound soundness on 20 controlled subjects
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_cocktail/cnip" \
            --output-dir cocktail-upper-soundness

      - name: Validate BnB correctness on 20 controlled subjects
        run: |
          EPPATHER_PREFIX_FEASIBILITY=1 \
          EPPATHER_PREFIX_SOLVER_TIMEOUT_MS=100 \
          EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96 \
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_SEED_WITH_DFS2=1 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_cocktail/cnip" \
            --output-dir cocktail-bnb-witness

      - name: Run cocktail-sort order-only and BnB
        shell: bash
        run: |
          set -u
          CNIP="${{ github.workspace }}/build_cocktail/cnip"
          SRC="${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c"
          mkdir -p cocktail-ab/order cocktail-ab/bnb120 cocktail-ab/bnb300

          COMMON=(
            EPPATHER_PREFIX_FEASIBILITY=1
            EPPATHER_PREFIX_SOLVER_TIMEOUT_MS=100
            EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96
            EPPATHER_MAXMEMS_CORE_ONLY=1
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1
            EPPATHER_MAXMEMS_LIGHT_LEAF=1
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1
            EPPATHER_MAXMEMS_SEED_WITH_DFS2=1
            EPPATHER_SUPPRESS_REDECL_WARNINGS=1
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1
          )

          (
            cd cocktail-ab/order
            timeout 120s env "${COMMON[@]}" \
              EPPATHER_MAXMEMS_BRANCH_ORDER=1 \
              "$CNIP" -g "$SRC" 3 > stdout.log 2> stderr.log
            echo $? > exit_code.txt
          ) || true

          (
            cd cocktail-ab/bnb120
            timeout 120s env "${COMMON[@]}" \
              EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
              "$CNIP" -g "$SRC" 3 > stdout.log 2> stderr.log
            echo $? > exit_code.txt
          ) || true

          BNB120_RC=$(cat cocktail-ab/bnb120/exit_code.txt 2>/dev/null || echo 124)
          if [ "$BNB120_RC" != "0" ]; then
            (
              cd cocktail-ab/bnb300
              timeout 300s env "${COMMON[@]}" \
                EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
                "$CNIP" -g "$SRC" 3 > stdout.log 2> stderr.log
              echo $? > exit_code.txt
            ) || true
          else
            echo 0 > cocktail-ab/bnb300/exit_code.txt
            cp cocktail-ab/bnb120/stdout.log cocktail-ab/bnb300/stdout.log
            cp cocktail-ab/bnb120/stderr.log cocktail-ab/bnb300/stderr.log
          fi

      - name: Summarize focused experiment
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path("cocktail-ab")
          def read(name):
              d = root / name
              rc = int((d/"exit_code.txt").read_text().strip()) if (d/"exit_code.txt").exists() else 124
              out = (d/"stdout.log").read_text(errors="replace") if (d/"stdout.log").exists() else ""
              def last(pattern):
                  vals = re.findall(pattern, out, re.M)
                  return vals[-1] if vals else None
              return {
                  "exit": rc,
                  "mems": int(last(r"^MEMS:\s*(-?\d+)\s*$")) if last(r"^MEMS:\s*(-?\d+)\s*$") else None,
                  "dp_time": float(last(r"^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds")) if last(r"^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds") else None,
                  "branch_bound_pruned": int(last(r"^\[DP BRANCH BOUND PRUNED\]:\s*(\d+)")) if last(r"^\[DP BRANCH BOUND PRUNED\]:\s*(\d+)") else None,
                  "branch_order_swaps": int(last(r"^\[DP BRANCH ORDER SWAPS\]:\s*(\d+)")) if last(r"^\[DP BRANCH ORDER SWAPS\]:\s*(\d+)") else None,
                  "leaf_solves": int(last(r"^\[DP LEAF SOLVES\]:\s*(\d+)")) if last(r"^\[DP LEAF SOLVES\]:\s*(\d+)") else None,
                  "prefix_checks": int(last(r"^\[DP PREFIX CHECKS\]:\s*(\d+)")) if last(r"^\[DP PREFIX CHECKS\]:\s*(\d+)") else None,
                  "prefix_pruned": int(last(r"^\[DP PREFIX PRUNED\]:\s*(\d+)")) if last(r"^\[DP PREFIX PRUNED\]:\s*(\d+)") else None,
              }

          result = {k: read(k) for k in ("order","bnb120","bnb300")}
          Path("cocktail-ab/summary.json").write_text(json.dumps(result, indent=2)+"\n")
          print("COCKTAIL_BNB_FOCUSED", json.dumps(result, sort_keys=True))
          if result["bnb300"]["exit"] != 0:
              raise SystemExit("cocktail-sort still timed out under 300s BnB")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-bnb-focused-results
          path: |
            cocktail-ab/
            cocktail-upper-soundness/
            cocktail-bnb-witness/
