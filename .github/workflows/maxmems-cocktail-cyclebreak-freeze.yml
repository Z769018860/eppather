name: MaxMEMS cocktail cyclebreak freeze

concurrency:
  group: maxmems-cocktail-cyclebreak-freeze-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-cyclebreak-freeze
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'C/syntax/EpatRunner.cpp'
      - 'C/syntax/EpatRunner.h'
      - 'tools/maxmems_witness_experiment.py'
      - '.github/workflows/maxmems-cocktail-cyclebreak-freeze.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build_cyclebreak -DANALYSIS_BACKEND=epat++

      - name: Build cnip
        run: cmake --build build_cyclebreak --target cnip -j2

      - name: Strict upper-bound soundness on 20 controlled subjects
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_FAST_TEXT_UPPER=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_cyclebreak/cnip" \
            --output-dir upper-soundness

      - name: BnB correctness on 20 controlled subjects
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_FAST_TEXT_UPPER=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_SEED_GREEDY=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_cyclebreak/cnip" \
            --output-dir bnb-witness

      - name: Run cocktail diagnostics and rescue
        shell: bash
        run: |
          set -u
          CNIP="${{ github.workspace }}/build_cyclebreak/cnip"
          SRC="${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c"
          mkdir -p cocktail-cyclebreak/diag30 cocktail-cyclebreak/rescue120 cocktail-cyclebreak/rescue300

          COMMON=(
            EPPATHER_MAXMEMS_CORE_ONLY=1
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1
            EPPATHER_MAXMEMS_LIGHT_LEAF=1
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1
            EPPATHER_MAXMEMS_FAST_TEXT_UPPER=1
            EPPATHER_MAXMEMS_BRANCH_BOUND=1
            EPPATHER_MAXMEMS_SEED_GREEDY=1
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1
            EPPATHER_MAXMEMS_PROGRESS_EVERY=1000
            EPPATHER_MAXMEMS_UPPER_PROGRESS_EVERY=1000
          )

          (
            cd cocktail-cyclebreak/diag30
            timeout 30s env "${COMMON[@]}" "$CNIP" -g "$SRC" 3 > stdout.log 2> stderr.log
            echo $? > exit_code.txt
          ) || true

          (
            cd cocktail-cyclebreak/rescue120
            timeout 120s env "${COMMON[@]}" "$CNIP" -g "$SRC" 3 > stdout.log 2> stderr.log
            echo $? > exit_code.txt
          ) || true

          RC=$(cat cocktail-cyclebreak/rescue120/exit_code.txt 2>/dev/null || echo 124)
          if [ "$RC" != "0" ]; then
            (
              cd cocktail-cyclebreak/rescue300
              timeout 300s env "${COMMON[@]}" "$CNIP" -g "$SRC" 3 > stdout.log 2> stderr.log
              echo $? > exit_code.txt
            ) || true
          else
            echo 0 > cocktail-cyclebreak/rescue300/exit_code.txt
            cp cocktail-cyclebreak/rescue120/stdout.log cocktail-cyclebreak/rescue300/stdout.log
            cp cocktail-cyclebreak/rescue120/stderr.log cocktail-cyclebreak/rescue300/stderr.log
          fi

      - name: Summarize cocktail result
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("cocktail-cyclebreak")
          def read(name):
              d=root/name
              out=(d/"stdout.log").read_text(errors="replace") if (d/"stdout.log").exists() else ""
              err=(d/"stderr.log").read_text(errors="replace") if (d/"stderr.log").exists() else ""
              rc=int((d/"exit_code.txt").read_text().strip()) if (d/"exit_code.txt").exists() else 124
              def last(pat,src):
                  xs=re.findall(pat,src,re.M)
                  return xs[-1] if xs else None
              prog=re.findall(r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+) incumbent=(-?\d+)",err)
              upper=re.findall(r"\[DP UPPER PROGRESS\]: states=(\d+) cache_hits=(\d+)",err)
              return {
                  "exit":rc,
                  "mems": int(last(r"^MEMS:\s*(-?\d+)\s*$",out)) if last(r"^MEMS:\s*(-?\d+)\s*$",out) else None,
                  "dp_time": float(last(r"^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds",out)) if last(r"^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds",out) else None,
                  "greedy_seed": int(last(r"^\[DP GREEDY SEEDED INCUMBENT\]:\s*(\d+)\s*$",out)) if last(r"^\[DP GREEDY SEEDED INCUMBENT\]:\s*(\d+)\s*$",out) else None,
                  "last_progress": prog[-1] if prog else None,
                  "last_upper_progress": upper[-1] if upper else None,
              }
          result={k:read(k) for k in ("diag30","rescue120","rescue300")}
          Path("cocktail-cyclebreak/summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("COCKTAIL_CYCLEBREAK",json.dumps(result,sort_keys=True))
          if result["rescue300"]["exit"] != 0:
              raise SystemExit("cocktail-sort still timed out after cyclebreak+fast-upper")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-cocktail-cyclebreak-results
          path: |
            cocktail-cyclebreak/
            upper-soundness/
            bnb-witness/
