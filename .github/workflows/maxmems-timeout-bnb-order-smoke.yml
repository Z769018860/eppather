name: MaxMEMS branch-order smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-timeout-bnb-order
    paths:
      - '.github/workflows/maxmems-timeout-bnb-order-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness
        run: |
          python3 -m py_compile tools/e2e_path_validation.py tools/maxmems_witness_experiment.py tools/maxmems_corpus_experiment.py
      - name: Configure
        run: cmake -S . -B build_bnb_order -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_bnb_order --target cnip -j2
      - name: Run 20-case correctness gate
        run: |
          EPPATHER_PREFIX_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_bnb_order/cnip" \
            --output-dir bnb-order-witness
      - name: Run active timeout set
        run: |
          EPPATHER_PREFIX_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          python3 tools/maxmems_corpus_experiment.py \
            --cnip "${{ github.workspace }}/build_bnb_order/cnip" \
            --corpus testcase/output_complete2 \
            --manifest docs/maxmems-active-timeout-manifest.txt \
            --expected-programs 6 \
            --output-dir bnb-order-active \
            --max-loop 3 --max-paths 1000 --timeout 60 --retry-timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-bnb-order-results
          path: |
            bnb-order-witness/
            bnb-order-active/
