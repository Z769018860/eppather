name: MaxMEMS cocktail fast-cycle

concurrency:
  group: maxmems-cocktail-fast-cycle-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-greedy-seed
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'C/syntax/EpatRunner.cpp'
      - '.github/workflows/maxmems-cocktail-fast-cycle.yml'

jobs:
  fast-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build_fast -DANALYSIS_BACKEND=epat++
      - run: cmake --build build_fast --target cnip -j2

      - name: Run four 60s cocktail variants
        shell: bash
        run: |
          set -u
          CNIP="${{ github.workspace }}/build_fast/cnip"
          SRC="${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c"
          mkdir -p fast-cycle

          run_one() {
            name="$1"; upper="$2"; prefix="$3"; ptimeout="$4"
            d="fast-cycle/$name"
            mkdir -p "$d"
            set +e
            timeout 60s env \
              EPPATHER_PREFIX_FEASIBILITY=1 \
              EPPATHER_PREFIX_SOLVER_TIMEOUT_MS="$ptimeout" \
              EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET="$prefix" \
              EPPATHER_MAXMEMS_UPPER_STATE_BUDGET="$upper" \
              EPPATHER_MAXMEMS_FAST_TEXT_UPPER=1 \
              EPPATHER_MAXMEMS_CORE_ONLY=1 \
              EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
              EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
              EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
              EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
              EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
              EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
              EPPATHER_MAXMEMS_LOOP_EXIT_FEASIBILITY=1 \
              EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
              EPPATHER_MAXMEMS_PROGRESS_EVERY=500 \
              "$CNIP" -g "$SRC" 3 > "$d/stdout.log" 2> "$d/stderr.log"
            rc=$?
            set -e
            echo "$rc" > "$d/exit_code.txt"
          }

          run_one u16_p256_t25 16 256 25
          run_one u32_p256_t25 32 256 25
          run_one u32_p1024_t25 32 1024 25
          run_one u64_p1024_t25 64 1024 25

      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("fast-cycle")
          rows=[]
          for d in sorted(p for p in root.iterdir() if p.is_dir()):
              out=(d/"stdout.log").read_text(errors="replace")
              err=(d/"stderr.log").read_text(errors="replace")
              rc=int((d/"exit_code.txt").read_text().strip())
              def last(p,s=out):
                  xs=re.findall(p,s,re.M)
                  return xs[-1] if xs else None
              prog=re.findall(
                  r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+) incumbent=(-?\d+)",
                  err)
              rows.append({
                  "variant":d.name,
                  "exit":rc,
                  "mems":int(last(r"^MEMS:\s*(-?\d+)\s*$")) if last(r"^MEMS:\s*(-?\d+)\s*$") else None,
                  "dp_time":float(last(r"^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds")) if last(r"^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds") else None,
                  "last_progress":tuple(map(int,prog[-1])) if prog else None,
              })
          (root/"summary.json").write_text(json.dumps(rows,indent=2)+"\n")
          print("COCKTAIL_FAST_CYCLE",json.dumps(rows,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-fast-cycle-results
          path: fast-cycle/
