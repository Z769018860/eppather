name: MaxMEMS timeout rescue

concurrency:
  group: maxmems-timeout-rescue-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness
        run: python3 -m py_compile tools/e2e_path_validation.py tools/maxmems_corpus_experiment.py tools/aggregate_maxmems_corpus.py
      - name: Configure
        run: cmake -S . -B build_rescue -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_rescue --target cnip -j2
      - name: Run one timeout-rescue subject
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 python3 tools/maxmems_corpus_experiment.py \
            --cnip "${{ github.workspace }}/build_rescue/cnip" \
            --corpus testcase/output_complete2 \
            --manifest docs/maxmems-historical-timeout-rescue-manifest.txt \
            --expected-programs 9 \
            --output-dir maxmems-timeout-rescue-${{ matrix.shard }} \
            --max-loop 3 --max-paths 1000 --timeout 900 --retry-timeout 900 \
            --shard-index ${{ matrix.shard }} --shard-count 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-timeout-rescue-${{ matrix.shard }}
          path: maxmems-timeout-rescue-${{ matrix.shard }}/

  aggregate:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: maxmems-timeout-rescue-*
          path: collected
          merge-multiple: true
      - name: Aggregate rescue results
        run: |
          python3 tools/aggregate_maxmems_corpus.py \
            --input collected --output maxmems-timeout-rescue-results \
            --expected-programs 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-timeout-rescue-results
          path: maxmems-timeout-rescue-results/
