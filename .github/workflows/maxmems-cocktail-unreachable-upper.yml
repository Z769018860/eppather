name: MaxMEMS cocktail unreachable-upper fix

concurrency:
  group: maxmems-cocktail-unreachable-upper-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-unreachable-upper
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'tools/maxmems_witness_experiment.py'
      - '.github/workflows/maxmems-cocktail-unreachable-upper.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build_fix -DANALYSIS_BACKEND=epat++
      - run: cmake --build build_fix --target cnip -j2

      - name: Strict upper-bound soundness gate
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LEXICAL_UPPER=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_fix/cnip" \
            --output-dir unreachable-upper-soundness

      - name: Optimized 20-case correctness gate
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_LEXICAL_UPPER=1 \
          EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=512 \
          EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_SEED_GREEDY=1 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_fix/cnip" \
            --output-dir unreachable-upper-witness

      - name: Run cocktail 30s diagnostic
        shell: bash
        run: |
          mkdir -p cocktail-fix-30
          set +e
          timeout 30s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_LEXICAL_UPPER=1 \
            EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=512 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=25 \
            "${{ github.workspace }}/build_fix/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > cocktail-fix-30/stdout.log 2> cocktail-fix-30/stderr.log
          echo $? > cocktail-fix-30/exit_code.txt
          exit 0

      - name: Run cocktail 120s if needed
        shell: bash
        run: |
          RC=$(cat cocktail-fix-30/exit_code.txt)
          mkdir -p cocktail-fix-120
          if [ "$RC" = "0" ]; then
            cp cocktail-fix-30/stdout.log cocktail-fix-120/stdout.log
            cp cocktail-fix-30/stderr.log cocktail-fix-120/stderr.log
            echo 0 > cocktail-fix-120/exit_code.txt
            exit 0
          fi
          set +e
          timeout 120s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_LEXICAL_UPPER=1 \
            EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=512 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=100 \
            "${{ github.workspace }}/build_fix/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > cocktail-fix-120/stdout.log 2> cocktail-fix-120/stderr.log
          echo $? > cocktail-fix-120/exit_code.txt
          exit 0

      - name: Assert and summarize
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          def read(d):
              d=Path(d)
              out=(d/"stdout.log").read_text(errors="replace")
              err=(d/"stderr.log").read_text(errors="replace")
              rc=int((d/"exit_code.txt").read_text().strip())
              prog=re.findall(r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+).*?incumbent=(-?\d+)",err)
              mems=re.findall(r"(?m)^MEMS:\s*(-?\d+)\s*$",out)
              times=re.findall(r"(?m)^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds",out)
              return {"exit":rc,
                      "last_progress":list(map(int,prog[-1])) if prog else None,
                      "mems":int(mems[-1]) if mems else None,
                      "dp_time":float(times[-1]) if times else None}
          result={"run30":read("cocktail-fix-30"),"run120":read("cocktail-fix-120")}
          Path("cocktail-fix-summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("UNREACHABLE_UPPER_FIX",json.dumps(result,sort_keys=True))
          if result["run120"]["exit"] != 0 or result["run120"]["mems"] is None:
              raise SystemExit("cocktail-sort still timed out")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-unreachable-upper-results
          path: |
            cocktail-fix-30/
            cocktail-fix-120/
            cocktail-fix-summary.json
            unreachable-upper-soundness/
            unreachable-upper-witness/
