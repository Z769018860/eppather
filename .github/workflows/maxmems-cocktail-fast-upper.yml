name: MaxMEMS cocktail fast-upper focused

concurrency:
  group: maxmems-cocktail-fast-upper-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-greedy-seed
    paths:
      - '.github/workflows/maxmems-cocktail-fast-upper.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build_fastupper -DANALYSIS_BACKEND=epat++

      - name: Build cnip
        run: cmake --build build_fastupper --target cnip -j2

      - name: Validate textual upper bound on 20 controlled subjects
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_FAST_SYNTAX_UPPER=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_fastupper/cnip" \
            --output-dir fast-upper-soundness

      - name: Validate fast-upper BnB correctness on 20 controlled subjects
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_FAST_SYNTAX_UPPER=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_SEED_WITH_DFS2=1 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_fastupper/cnip" \
            --output-dir fast-upper-bnb-witness

      - name: Run cocktail-sort 120s
        shell: bash
        run: |
          set -u
          CNIP="${{ github.workspace }}/build_fastupper/cnip"
          SRC="${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c"
          mkdir -p cocktail-fast-upper
          (
            cd cocktail-fast-upper
            timeout 120s env \
              EPPATHER_MAXMEMS_CORE_ONLY=1 \
              EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
              EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
              EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
              EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
              EPPATHER_MAXMEMS_FAST_SYNTAX_UPPER=1 \
              EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
              EPPATHER_MAXMEMS_SEED_WITH_DFS2=1 \
              EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
              EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
              EPPATHER_MAXMEMS_PROGRESS_EVERY=1000 \
              "$CNIP" -g "$SRC" 3 > stdout.log 2> stderr.log
            echo $? > exit_code.txt
          ) || true

      - name: Assert cocktail completion
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("cocktail-fast-upper")
          rc=int((d/"exit_code.txt").read_text().strip())
          out=(d/"stdout.log").read_text(errors="replace")
          err=(d/"stderr.log").read_text(errors="replace")
          mems=re.findall(r"(?m)^MEMS:\s*(-?\d+)\s*$",out)
          times=re.findall(r"(?m)^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds",out)
          prog=re.findall(r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+).*?incumbent=(-?\d+)",err)
          result={"exit":rc,"mems":int(mems[-1]) if mems else None,
                  "dp_time":float(times[-1]) if times else None,
                  "last_progress":prog[-1] if prog else None}
          (d/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("FAST_UPPER_COCKTAIL",json.dumps(result,sort_keys=True))
          if rc != 0 or not mems:
              raise SystemExit("cocktail-sort still timed out or produced no MEMS")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-fast-upper-results
          path: |
            cocktail-fast-upper/
            fast-upper-soundness/
            fast-upper-bnb-witness/
