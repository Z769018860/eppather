name: MaxMEMS active timeout rescue

concurrency:
  group: maxmems-active-timeout-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-prefix-pruning-rescue
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'C/syntax/SyntaxNamePrinter.h'
      - 'C/syntax/EpatRunner.cpp'
      - 'C/syntax/EpatRunner.h'
      - 'tools/maxmems_corpus_experiment.py'
      - 'tools/maxmems_witness_experiment.py'
      - 'tools/e2e_path_validation.py'
      - 'docs/maxmems-active-timeout-manifest.txt'
      - '.github/workflows/maxmems-active-timeout-rescue.yml'

jobs:
  witness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build_active_witness -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_active_witness --target cnip -j2
      - name: Run 20-case witness gate
        run: |
          EPPATHER_PREFIX_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_active_witness/cnip" \
            --output-dir maxmems-active-witness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-active-witness
          path: maxmems-active-witness/

  validate:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, optimized]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build_active -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_active --target cnip -j2
      - name: Run active timeout subject
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "optimized" ]; then
            export EPPATHER_PREFIX_FEASIBILITY=1
            export EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1
            export EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1
            export EPPATHER_MAXMEMS_LIGHT_LEAF=1
            export EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1
            export EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96
            export EPPATHER_SUPPRESS_REDECL_WARNINGS=1
            export EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1
          fi
          export EPPATHER_MAXMEMS_CORE_ONLY=1
          python3 tools/maxmems_corpus_experiment.py \
            --cnip "${{ github.workspace }}/build_active/cnip" \
            --corpus testcase/output_complete2 \
            --manifest docs/maxmems-active-timeout-manifest.txt \
            --expected-programs 6 \
            --output-dir "active-${{ matrix.variant }}-${{ matrix.shard }}" \
            --max-loop 3 --max-paths 1000 --timeout 120 --retry-timeout 120 \
            --shard-index ${{ matrix.shard }} --shard-count 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-${{ matrix.variant }}-${{ matrix.shard }}
          path: active-${{ matrix.variant }}-${{ matrix.shard }}/
