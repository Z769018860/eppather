name: MaxMEMS cocktail lexical-upper focused

concurrency:
  group: maxmems-cocktail-lexical-upper-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-lexical-upper
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'C/syntax/EpatRunner.cpp'
      - 'C/syntax/EpatRunner.h'
      - 'tools/maxmems_witness_experiment.py'
      - '.github/workflows/maxmems-cocktail-lexical-upper.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build_lexical -DANALYSIS_BACKEND=epat++

      - name: Build cnip
        run: cmake --build build_lexical --target cnip -j2

      - name: Strict lexical-upper soundness gate
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LEXICAL_UPPER=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_lexical/cnip" \
            --output-dir lexical-upper-soundness

      - name: Full optimized correctness gate
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_LEXICAL_UPPER=1 \
          EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=128 \
          EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_SEED_GREEDY=1 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_lexical/cnip" \
            --output-dir lexical-upper-bnb-witness

      - name: Run 30s cocktail diagnostic
        shell: bash
        run: |
          mkdir -p cocktail-lexical-diag
          set +e
          timeout 30s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_LEXICAL_UPPER=1 \
            EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=128 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=100 \
            "${{ github.workspace }}/build_lexical/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > cocktail-lexical-diag/stdout.log \
            2> cocktail-lexical-diag/stderr.log
          echo $? > cocktail-lexical-diag/exit_code.txt
          exit 0

      - name: Summarize diagnostic
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("cocktail-lexical-diag")
          out=(d/"stdout.log").read_text(errors="replace")
          err=(d/"stderr.log").read_text(errors="replace")
          rc=int((d/"exit_code.txt").read_text().strip())
          prog=re.findall(r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+).*?incumbent=(-?\d+)",err)
          seed=re.findall(r"\[DP GREEDY SEEDED INCUMBENT\]:\s*(\d+)",out)
          mems=re.findall(r"(?m)^MEMS:\s*(-?\d+)\s*$",out)
          result={
            "exit":rc,
            "last_progress":list(map(int,prog[-1])) if prog else None,
            "seed":int(seed[-1]) if seed else None,
            "mems":int(mems[-1]) if mems else None,
          }
          (d/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("LEXICAL_UPPER_DIAG",json.dumps(result,sort_keys=True))
          PY

      - name: Run cocktail 120s
        shell: bash
        run: |
          mkdir -p cocktail-lexical-120
          set +e
          timeout 120s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_LEXICAL_UPPER=1 \
            EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=128 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=500 \
            "${{ github.workspace }}/build_lexical/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > cocktail-lexical-120/stdout.log \
            2> cocktail-lexical-120/stderr.log
          echo $? > cocktail-lexical-120/exit_code.txt
          exit 0

      - name: Assert cocktail completion
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("cocktail-lexical-120")
          rc=int((d/"exit_code.txt").read_text().strip())
          out=(d/"stdout.log").read_text(errors="replace")
          err=(d/"stderr.log").read_text(errors="replace")
          mems=re.findall(r"(?m)^MEMS:\s*(-?\d+)\s*$",out)
          times=re.findall(r"(?m)^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds",out)
          prog=re.findall(r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+).*?incumbent=(-?\d+)",err)
          result={
            "exit":rc,
            "mems":int(mems[-1]) if mems else None,
            "dp_time":float(times[-1]) if times else None,
            "last_progress":list(map(int,prog[-1])) if prog else None,
          }
          (d/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("LEXICAL_UPPER_COCKTAIL",json.dumps(result,sort_keys=True))
          if rc != 0 or not mems:
              raise SystemExit("cocktail-sort still timed out")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-lexical-upper-results
          path: |
            cocktail-lexical-diag/
            cocktail-lexical-120/
            lexical-upper-soundness/
            lexical-upper-bnb-witness/
