name: VolCE loop state summaries

on:
  push:
    branches:
      - feature/volce-state-transition-summaries
  pull_request:
    paths:
      - 'C/syntax/EpatRunner.*'
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'volce/volce_api.*'
      - 'tests/VolceStateSummaryTests.cpp'
      - 'tools/validate_volce_loop_summaries.sh'
      - 'tools/validate_volce_loop_failure_modes.sh'
      - '.github/workflows/volce-loop-state-summary.yml'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build_ci_volce_summary -DANALYSIS_BACKEND=epat++
      - run: cmake --build build_ci_volce_summary --target cnip -j2
      - run: cmake --build build_ci_volce_summary --target volce-summary-tests -j2
      - run: ./build_ci_volce_summary/volce-summary-tests
      - name: Validate entailed summaries through VolCE
        env:
          CNIP: ${{ github.workspace }}/build_ci_volce_summary/cnip
        run: bash tools/validate_volce_loop_summaries.sh
      - name: Validate diagnosed loop failure modes
        env:
          CNIP: ${{ github.workspace }}/build_ci_volce_summary/cnip
        run: bash tools/validate_volce_loop_failure_modes.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volce-loop-state-summary-results
          path: |
            volce-loop-summary-results/
            volce-loop-failure-results/
