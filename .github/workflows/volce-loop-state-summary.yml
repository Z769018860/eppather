name: VolCE loop state summaries

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build_ci_volce_summary -DANALYSIS_BACKEND=epat++
      - run: cmake --build build_ci_volce_summary --target volce-summary-tests -j2
      - run: ./build_ci_volce_summary/volce-summary-tests
      - run: cmake --build build_ci_volce_summary --target loopscc-adapter-tests -j2
      - run: ./build_ci_volce_summary/loopscc-adapter-tests
      - run: cmake --build build_ci_volce_summary --target cnip -j2
      - name: Validate LoopSCC SPath/CSG adapter
        env:
          CNIP: ${{ github.workspace }}/build_ci_volce_summary/cnip
        run: bash tools/validate_loopscc_spath_adapter.sh
      - name: Validate inside-out nested LoopSCC acceleration
        env:
          CNIP: ${{ github.workspace }}/build_ci_volce_summary/cnip
        run: bash tools/validate_loopscc_nested_acceleration.sh
      - name: Validate entailed summaries through VolCE
        env:
          CNIP: ${{ github.workspace }}/build_ci_volce_summary/cnip
        run: bash tools/validate_volce_loop_summaries.sh
      - name: Validate diagnosed loop failure modes
        env:
          CNIP: ${{ github.workspace }}/build_ci_volce_summary/cnip
        run: bash tools/validate_volce_loop_failure_modes.sh
      - name: Evaluate LoopSCC-compatible integration against baseline
        env:
          CNIP: ${{ github.workspace }}/build_ci_volce_summary/cnip
          TIMEOUT_SECONDS: 90
        run: bash tools/evaluate_loopscc_integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volce-loop-state-summary-results
          path: |
            volce-loop-summary-results/
            volce-loop-failure-results/
            loopscc-effect-results/
            loopscc-spath-results/
            loopscc-nested-results/
