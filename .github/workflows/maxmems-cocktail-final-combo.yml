name: MaxMEMS cocktail final combo

concurrency:
  group: maxmems-cocktail-final-combo-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-greedy-seed
    paths:
      - '.github/workflows/maxmems-cocktail-final-combo.yml'

jobs:
  combo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build_combo -DANALYSIS_BACKEND=epat++

      - name: Build cnip
        run: cmake --build build_combo --target cnip -j2

      - name: 20-case combo correctness gate
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_FAST_SYNTAX_UPPER=1 \
          EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=128 \
          EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_SEED_GREEDY=1 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_combo/cnip" \
            --output-dir combo-witness

      - name: Run cocktail 120s combo
        shell: bash
        run: |
          set +e
          mkdir -p combo
          timeout 120s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_FAST_SYNTAX_UPPER=1 \
            EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=128 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=1000 \
            "${{ github.workspace }}/build_combo/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > combo/stdout.log 2> combo/stderr.log
          rc=$?
          echo "$rc" > combo/exit_code.txt
          exit 0

      - name: Assert cocktail completion
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("combo")
          out=(d/"stdout.log").read_text(errors="replace")
          err=(d/"stderr.log").read_text(errors="replace")
          rc=int((d/"exit_code.txt").read_text().strip())
          def last(p,t):
              xs=re.findall(p,t,re.M)
              return xs[-1] if xs else None
          result={
            "exit":rc,
            "mems": (lambda x:int(x) if x is not None else None)(last(r"^MEMS:\s*(-?\d+)\s*$",out)),
            "dp_time": (lambda x:float(x) if x is not None else None)(last(r"^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds",out)),
            "greedy_seed": (lambda x:int(x) if x is not None else None)(last(r"^\[DP GREEDY SEEDED INCUMBENT\]:\s*(\d+)\s*$",out)),
            "path_local_pruned": (lambda x:int(x) if x is not None else None)(last(r"^\[DP PATH LOCAL GUARD PRUNES\]:\s*(\d+)",out)),
            "bnb_pruned": (lambda x:int(x) if x is not None else None)(last(r"^\[DP BRANCH BOUND PRUNED\]:\s*(\d+)",out)),
            "leaf_solves": (lambda x:int(x) if x is not None else None)(last(r"^\[DP LEAF SOLVES\]:\s*(\d+)",out)),
            "states": (lambda x:int(x) if x is not None else None)(last(r"^\[DP STATES VISITED\]:\s*(\d+)",out)),
          }
          (d/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("COCKTAIL_FINAL_COMBO",json.dumps(result,sort_keys=True))
          if rc != 0 or result["mems"] is None:
              raise SystemExit("cocktail final combo still timed out")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-final-combo-results
          path: |
            combo/
            combo-witness/
