name: MaxMEMS witness validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'tools/maxmems_witness_experiment.py'
      - 'tools/e2e_path_validation.py'
      - 'docs/maxmems-witness-validation-2026-09-24.md'
      - '.github/workflows/maxmems-witness-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate experiment harness
        run: |
          python3 -m py_compile tools/e2e_path_validation.py tools/maxmems_witness_experiment.py
          python3 -c 'import sys; sys.path.insert(0,"tools"); from e2e_path_validation import parse_signature; assert parse_signature("int smoke(int x){return x;}","smoke")==("smoke",["x"])'
      - name: Configure Eppather
        run: cmake -S . -B build_maxmems_witness -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_maxmems_witness --target cnip -j2
      - name: Run independent MaxMEMS witness experiment
        run: |
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_maxmems_witness/cnip" \
            --output-dir maxmems-witness-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-witness-results
          path: maxmems-witness-results/
