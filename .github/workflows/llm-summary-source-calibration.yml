name: LLM summary source calibration

on:
  pull_request:
    paths:
      - 'testcase/llm_calibrated/lua_zread_summary.c'
      - 'tools/validate_lua_projection.py'
      - 'tools/make_lua_fixed_witness.py'
      - 'tools/run_lua_fixed_witnesses.py'
      - '.github/workflows/llm-summary-source-calibration.yml'
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compare against original Lua source
        run: |
          python3 tools/validate_lua_projection.py \
            --lua-source testcase/lua/lzio.c \
            --projection testcase/llm_calibrated/lua_zread_summary.c \
            --csv llm-calibration-results/lua_witness.csv
      - name: Configure Eppather
        run: cmake -S . -B build_llm_calibration -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_llm_calibration --target cnip -j2
      - name: Compare fixed-input Eppather paths
        run: |
          python3 tools/run_lua_fixed_witnesses.py \
            --cnip build_llm_calibration/cnip \
            --projection testcase/llm_calibrated/lua_zread_summary.c \
            --witness-csv llm-calibration-results/lua_witness.csv \
            --output-dir llm-calibration-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-summary-source-calibration
          path: llm-calibration-results/
