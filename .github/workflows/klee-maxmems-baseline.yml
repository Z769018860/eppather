name: KLEE MaxMEMS baseline

on:
  workflow_dispatch:
  push:
    branches:
      - review/maxmems-methodology-evidence
    paths:
      - 'tools/klee_maxmems_baseline.py'
      - 'tools/maxmems_witness_experiment.py'
      - 'tools/e2e_path_validation.py'
      - '.github/workflows/klee-maxmems-baseline.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate baseline harness
        run: python3 -m py_compile tools/klee_maxmems_baseline.py tools/maxmems_witness_experiment.py tools/e2e_path_validation.py
      - name: Run KLEE 3.2 baseline
        run: |
          python3 tools/klee_maxmems_baseline.py             --output-dir klee-maxmems-results             --image klee/klee:3.2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klee-maxmems-results
          path: klee-maxmems-results/
