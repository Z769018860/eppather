name: MaxMEMS cocktail no-loop-exit final

concurrency:
  group: maxmems-cocktail-no-loop-exit-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-greedy-seed
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - '.github/workflows/maxmems-cocktail-no-loop-exit.yml'

jobs:
  cocktail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build_nole -DANALYSIS_BACKEND=epat++
      - run: cmake --build build_nole --target cnip -j2
      - name: Run cocktail 120s without loop-exit SMT
        shell: bash
        run: |
          set +e
          mkdir -p no-loop-exit
          timeout 120s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_MAXMEMS_SEED_EXIT_FIRST=1 \
            EPPATHER_MAXMEMS_FAST_TEXT_UPPER=1 \
            EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=32 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=100 \
            "${{ github.workspace }}/build_nole/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > no-loop-exit/stdout.log 2> no-loop-exit/stderr.log
          rc=$?
          echo "$rc" > no-loop-exit/exit_code.txt
          exit 0
      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("no-loop-exit")
          out=(d/"stdout.log").read_text(errors="replace")
          err=(d/"stderr.log").read_text(errors="replace")
          rc=int((d/"exit_code.txt").read_text().strip())
          def last(p,s):
              xs=re.findall(p,s,re.M)
              return xs[-1] if xs else None
          seed=last(r"^\[DP GREEDY SEEDED INCUMBENT\]:\s*(\d+)\s*$",out)
          mem=last(r"^MEMS:\s*(-?\d+)\s*$",out)
          prog=re.findall(r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+).*incumbent=(-?\d+)",err)
          result={
            "exit":rc,
            "seed":int(seed) if seed else None,
            "mems":int(mem) if mem else None,
            "last_progress":list(map(int,prog[-1])) if prog else None,
          }
          (d/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("COCKTAIL_NO_LOOP_EXIT",json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-no-loop-exit-results
          path: no-loop-exit/
