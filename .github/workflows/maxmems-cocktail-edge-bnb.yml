name: MaxMEMS cocktail edge-BnB rescue

concurrency:
  group: maxmems-cocktail-edge-bnb-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-final-freeze
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - '.github/workflows/maxmems-cocktail-edge-bnb.yml'
      - 'tools/maxmems_witness_experiment.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build_edge -DANALYSIS_BACKEND=epat++
      - run: cmake --build build_edge --target cnip -j2

      - name: 20-case upper-bound soundness
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_edge/cnip" \
            --output-dir edge-upper-soundness

      - name: 20-case edge-BnB correctness
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_EDGE_BNB=1 \
          EPPATHER_MAXMEMS_SEED_GREEDY=1 \
          EPPATHER_MAXMEMS_SEED_FEASIBLE_PATHS=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_edge/cnip" \
            --output-dir edge-bnb-witness

      - name: Cocktail 60s edge-BnB
        shell: bash
        run: |
          set +e
          mkdir -p cocktail-edge
          timeout 60s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_EDGE_BNB=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_MAXMEMS_SEED_FEASIBLE_PATHS=1 \
            EPPATHER_MAXMEMS_UPPER_STATE_BUDGET=300 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=1000 \
            "${{ github.workspace }}/build_edge/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > cocktail-edge/stdout.log 2> cocktail-edge/stderr.log
          rc=$?
          echo "$rc" > cocktail-edge/exit_code.txt
          exit 0

      - name: Assert cocktail solved
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("cocktail-edge")
          out=(d/"stdout.log").read_text(errors="replace")
          err=(d/"stderr.log").read_text(errors="replace")
          rc=int((d/"exit_code.txt").read_text().strip())
          mems=[int(x) for x in re.findall(r"(?m)^MEMS:\s*(-?\d+)\s*$",out)]
          result={"exit":rc,"mems":mems[-1] if mems else None}
          (d/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("COCKTAIL_EDGE_BNB",json.dumps(result,sort_keys=True))
          if rc != 0 or not mems or mems[-1] < 0:
              raise SystemExit("cocktail edge-BnB did not finish")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-edge-bnb-results
          path: |
            cocktail-edge/
            edge-upper-soundness/
            edge-bnb-witness/
