name: MaxMEMS cocktail finite-upper rescue

concurrency:
  group: maxmems-cocktail-finite-upper-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-greedy-seed
    paths:
      - '.github/workflows/maxmems-cocktail-finite-upper.yml'

jobs:
  rescue:
    strategy:
      fail-fast: false
      matrix:
        variant: [fast, exact]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build_finite -DANALYSIS_BACKEND=epat++
      - run: cmake --build build_finite --target cnip -j2

      - name: Run finite-upper cocktail rescue
        shell: bash
        run: |
          set +e
          OUT="finite-${{ matrix.variant }}"
          mkdir -p "$OUT"
          EXTRA=()
          if [ "${{ matrix.variant }}" = "fast" ]; then
            EXTRA=(EPPATHER_MAXMEMS_FAST_SYNTAX_UPPER=1)
          fi
          timeout 60s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_MAXMEMS_SEED_FEASIBLE_PATHS=1 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=100 \
            EPPATHER_MAXMEMS_UPPER_PROGRESS_EVERY=100 \
            EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
            "${EXTRA[@]}" \
            "${{ github.workspace }}/build_finite/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > "$OUT/stdout.log" 2> "$OUT/stderr.log"
          rc=$?
          echo "$rc" > "$OUT/exit_code.txt"
          exit 0

      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("finite-${{ matrix.variant }}")
          out=(d/"stdout.log").read_text(errors="replace")
          err=(d/"stderr.log").read_text(errors="replace")
          rc=int((d/"exit_code.txt").read_text().strip())
          def last(p,text):
              xs=re.findall(p,text,re.M); return xs[-1] if xs else None
          p=last(r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+).*incumbent=(-?\d+)",err)
          u=last(r"\[DP UPPER PROGRESS\]: states=(\d+) cache_hits=(\d+) budget_skips=(\d+).*local_misses=(\d+).*local_us=(\d+).*key_us=(\d+).*loopbound_us=(\d+)",err)
          result={
            "variant":"${{ matrix.variant }}",
            "exit":rc,
            "mems": int(x) if (x:=last(r"^MEMS:\s*(-?\d+)\s*$",out)) else None,
            "seed": int(x) if (x:=last(r"^\[DP GREEDY SEEDED INCUMBENT\]:\s*(\d+)\s*$",out)) else None,
            "last_progress": list(map(int,p)) if p else None,
            "last_upper": list(map(int,u)) if u else None,
          }
          (d/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("FINITE_UPPER_RESCUE",json.dumps(result,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-upper-${{ matrix.variant }}
          path: finite-${{ matrix.variant }}/
