name: MaxMEMS cocktail progress trace

concurrency:
  group: maxmems-cocktail-progress-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-progress
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - '.github/workflows/maxmems-cocktail-progress.yml'

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build_progress -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_progress --target cnip -j2
      - name: Run 30s progress traces
        shell: bash
        run: |
          set +e
          CNIP="${{ github.workspace }}/build_progress/cnip"
          SRC="${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c"
          mkdir -p progress/no-seed progress/seed
          BASE=(
            EPPATHER_PREFIX_FEASIBILITY=1
            EPPATHER_PREFIX_SOLVER_TIMEOUT_MS=100
            EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96
            EPPATHER_MAXMEMS_CORE_ONLY=1
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1
            EPPATHER_MAXMEMS_LIGHT_LEAF=1
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1
            EPPATHER_MAXMEMS_BRANCH_BOUND=1
            EPPATHER_SUPPRESS_REDECL_WARNINGS=1
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1
            EPPATHER_MAXMEMS_PROGRESS_INTERVAL=10000
          )
          (cd progress/no-seed && timeout 30s env "${BASE[@]}" "$CNIP" -g "$SRC" 3 >stdout.log 2>stderr.log; echo $? >exit.txt)
          (cd progress/seed && timeout 30s env "${BASE[@]}" EPPATHER_MAXMEMS_SEED_WITH_DFS2=1 "$CNIP" -g "$SRC" 3 >stdout.log 2>stderr.log; echo $? >exit.txt)
          echo "=== NO SEED STDERR ==="; tail -n 80 progress/no-seed/stderr.log
          echo "=== SEED STDERR ==="; tail -n 80 progress/seed/stderr.log
          echo "=== NO SEED STDOUT ==="; tail -n 80 progress/no-seed/stdout.log
          echo "=== SEED STDOUT ==="; tail -n 80 progress/seed/stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-progress-trace
          path: progress/
