name: MaxMEMS prefix-pruning rescue

concurrency:
  group: maxmems-prefix-pruning-rescue-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-prefix-pruning-rescue
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'C/syntax/SyntaxNamePrinter.h'
      - 'C/syntax/EpatRunner.h'
      - 'C/syntax/EpatRunner.cpp'
      - 'tools/maxmems_corpus_experiment.py'
      - 'tools/maxmems_witness_experiment.py'
      - 'tools/e2e_path_validation.py'
      - 'tools/compare_maxmems_prefix_rescue.py'
      - 'docs/maxmems-historical-timeout-rescue-manifest.txt'
      - '.github/workflows/maxmems-prefix-pruning-rescue.yml'

jobs:
  witness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness
        run: python3 -m py_compile tools/e2e_path_validation.py tools/maxmems_witness_experiment.py
      - name: Configure
        run: cmake -S . -B build_prefix_witness -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_prefix_witness --target cnip -j2
      - name: Run 20-case witness gate with prefix pruning
        run: |
          EPPATHER_PREFIX_FEASIBILITY=1 EPPATHER_MAXMEMS_CORE_ONLY=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_prefix_witness/cnip" \
            --output-dir maxmems-prefix-witness-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-prefix-witness-results
          path: maxmems-prefix-witness-results/

  baseline-rescue:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness
        run: python3 -m py_compile tools/e2e_path_validation.py tools/maxmems_corpus_experiment.py
      - name: Configure
        run: cmake -S . -B build_baseline_rescue -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_baseline_rescue --target cnip -j2
      - name: Run one subject with current baseline
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          python3 tools/maxmems_corpus_experiment.py \
            --cnip "${{ github.workspace }}/build_baseline_rescue/cnip" \
            --corpus testcase/output_complete2 \
            --manifest docs/maxmems-historical-timeout-rescue-manifest.txt \
            --expected-programs 9 \
            --output-dir maxmems-baseline-rescue-${{ matrix.shard }} \
            --max-loop 3 --max-paths 1000 --timeout 120 --retry-timeout 120 \
            --shard-index ${{ matrix.shard }} --shard-count 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-baseline-rescue-${{ matrix.shard }}
          path: maxmems-baseline-rescue-${{ matrix.shard }}/

  prefix-rescue:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness
        run: python3 -m py_compile tools/e2e_path_validation.py tools/maxmems_corpus_experiment.py
      - name: Configure
        run: cmake -S . -B build_prefix_rescue -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_prefix_rescue --target cnip -j2
      - name: Run one subject with prefix pruning
        run: |
          EPPATHER_PREFIX_FEASIBILITY=1 EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          python3 tools/maxmems_corpus_experiment.py \
            --cnip "${{ github.workspace }}/build_prefix_rescue/cnip" \
            --corpus testcase/output_complete2 \
            --manifest docs/maxmems-historical-timeout-rescue-manifest.txt \
            --expected-programs 9 \
            --output-dir maxmems-prefix-rescue-${{ matrix.shard }} \
            --max-loop 3 --max-paths 1000 --timeout 120 --retry-timeout 120 \
            --shard-index ${{ matrix.shard }} --shard-count 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-prefix-rescue-${{ matrix.shard }}
          path: maxmems-prefix-rescue-${{ matrix.shard }}/


  compare:
    needs: [witness-gate, baseline-rescue, prefix-rescue]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: maxmems-baseline-rescue-*
          path: baseline
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: maxmems-prefix-rescue-*
          path: prefix
          merge-multiple: true
      - name: Compare baseline and prefix pruning
        run: |
          python3 tools/compare_maxmems_prefix_rescue.py \
            --baseline baseline --prefix prefix \
            --output maxmems-prefix-ab-results --expected 9
          echo "Witness gate result: ${{ needs.witness-gate.result }}" > maxmems-prefix-ab-results/witness-gate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxmems-prefix-ab-results
          path: maxmems-prefix-ab-results/
