name: MaxMEMS BnB order sharded

concurrency:
  group: maxmems-bnb-order-sharded-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-timeout-bnb-order-sharded
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'C/syntax/SyntaxNamePrinter.h'
      - 'C/syntax/EpatRunner.cpp'
      - 'C/syntax/EpatRunner.h'
      - 'tools/maxmems_corpus_experiment.py'
      - 'tools/maxmems_witness_experiment.py'
      - 'docs/maxmems-hard-timeout2-manifest.txt'
      - '.github/workflows/maxmems-bnb-order-sharded.yml'

jobs:
  witness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build_witness -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_witness --target cnip -j2
      - name: Run 20-case correctness gate
        run: |
          EPPATHER_PREFIX_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_witness/cnip" \
            --output-dir bnb-order-sharded-witness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-order-sharded-witness
          path: bnb-order-sharded-witness/


  upper-bound-soundness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build_upper -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_additive --target cnip -j2
      - name: Validate MEMS upper-bound soundness on 20 controlled witnesses
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_additive/cnip" \
            --output-dir upper-bound-soundness-witness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: additive-mems-witness
          path: additive-mems-witness/

  hard-timeout:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build_hard -DANALYSIS_BACKEND=epat++
      - name: Build cnip
        run: cmake --build build_hard --target cnip -j2
      - name: Run one remaining hard timeout subject
        run: |
          EPPATHER_PREFIX_FEASIBILITY=1 \
          EPPATHER_PREFIX_SOLVER_TIMEOUT_MS=100 \
          EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=96 \
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_SUPPRESS_REDECL_WARNINGS=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          python3 tools/maxmems_corpus_experiment.py \
            --cnip "${{ github.workspace }}/build_hard/cnip" \
            --corpus testcase/output_complete2 \
            --manifest docs/maxmems-hard-timeout2-manifest.txt \
            --expected-programs 2 \
            --output-dir "bnb-order-hard-${{ matrix.shard }}" \
            --max-loop 3 --max-paths 1000 --timeout 120 --retry-timeout 120 \
            --shard-index ${{ matrix.shard }} --shard-count 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnb-order-hard-${{ matrix.shard }}
          path: bnb-order-hard-${{ matrix.shard }}/
