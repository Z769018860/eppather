name: MaxMEMS cocktail final timeout candidate

concurrency:
  group: maxmems-cocktail-final-candidate-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/maxmems-cocktail-greedy-seed
    paths:
      - 'C/syntax/SyntaxNamePrinter.cpp'
      - 'C/syntax/EpatRunner.cpp'
      - 'C/syntax/EpatRunner.h'
      - 'tools/maxmems_witness_experiment.py'
      - '.github/workflows/maxmems-cocktail-combined-smoke.yml'

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build_candidate -DANALYSIS_BACKEND=epat++
      - run: cmake --build build_candidate --target cnip -j2

      - name: 20-case final candidate correctness gate
        run: |
          EPPATHER_MAXMEMS_CORE_ONLY=1 \
          EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
          EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
          EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
          EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
          EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
          EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
          EPPATHER_PREFIX_FEASIBILITY=1 \
          EPPATHER_PREFIX_SOLVER_TIMEOUT_MS=25 \
          EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=128 \
          EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
          EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_MAXMEMS_SEED_FEASIBLE_PATHS=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND=1 \
          EPPATHER_MAXMEMS_VALIDATE_UPPER_BOUND_STRICT=1 \
          python3 tools/maxmems_witness_experiment.py \
            --cnip "${{ github.workspace }}/build_candidate/cnip" \
            --output-dir candidate-witness

      - name: Run cocktail 120s final candidate
        shell: bash
        run: |
          set +e
          mkdir -p candidate
          timeout 120s env \
            EPPATHER_MAXMEMS_CORE_ONLY=1 \
            EPPATHER_MAXMEMS_DISABLE_PATH_MEMO=1 \
            EPPATHER_MAXMEMS_DECISION_ONLY_PATH=1 \
            EPPATHER_MAXMEMS_LIGHT_LEAF=1 \
            EPPATHER_MAXMEMS_LAZY_LEAF_FEASIBILITY=1 \
            EPPATHER_MAXMEMS_PATH_LOCAL_GUARD_PRUNE=1 \
            EPPATHER_MAXMEMS_EXACT_GUARD_PRUNE=1 \
            EPPATHER_PREFIX_FEASIBILITY=1 \
          EPPATHER_PREFIX_SOLVER_TIMEOUT_MS=25 \
          EPPATHER_MAXMEMS_PREFIX_QUERY_BUDGET=128 \
            EPPATHER_MAXMEMS_BRANCH_BOUND=1 \
            EPPATHER_MAXMEMS_SEED_GREEDY=1 \
            EPPATHER_MAXMEMS_SEED_FEASIBLE_PATHS=1 \
            EPPATHER_MAXMEMS_PROGRESS_EVERY=100 \
            "${{ github.workspace }}/build_candidate/cnip" -g \
            "${{ github.workspace }}/testcase/output_complete2/sorting-algorithms-cocktail-sort-1.c" 3 \
            > candidate/stdout.log 2> candidate/stderr.log
          rc=$?
          echo "$rc" > candidate/exit_code.txt
          exit 0

      - name: Summarize
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=Path("candidate")
          out=(d/"stdout.log").read_text(errors="replace")
          err=(d/"stderr.log").read_text(errors="replace")
          rc=int((d/"exit_code.txt").read_text().strip())
          def last(pattern, text):
              xs=re.findall(pattern,text,re.M)
              return xs[-1] if xs else None
          p=last(r"\[DP PROGRESS\]: states=(\d+) leaves=(\d+) bnb_pruned=(\d+) prefix_checks=(\d+) prefix_pruned=(\d+) incumbent=(-?\d+)",err)
          result={
            "exit":rc,
            "mems": (lambda x:int(x) if x is not None else None)(last(r"^MEMS:\s*(-?\d+)\s*$",out)),
            "dp_time": (lambda x:float(x) if x is not None else None)(last(r"^\[DP TIME COST\]:\s*([0-9.eE+-]+)\s+seconds",out)),
            "seed": (lambda x:int(x) if x is not None else None)(last(r"^\[DP GREEDY SEEDED INCUMBENT\]:\s*(\d+)\s*$",out)),
            "last_progress": list(map(int,p)) if p else None,
            "loop_exit_pruned": (lambda x:int(x) if x is not None else None)(last(r"^\[DP LOOP EXIT PRUNED\]:\s*(\d+)",out)),
            "path_local_pruned": (lambda x:int(x) if x is not None else None)(last(r"^\[DP PATH LOCAL GUARD PRUNES\]:\s*(\d+)",out)),
            "bnb_pruned": (lambda x:int(x) if x is not None else None)(last(r"^\[DP BRANCH BOUND PRUNED\]:\s*(\d+)",out)),
            "leaf_solves": (lambda x:int(x) if x is not None else None)(last(r"^\[DP LEAF SOLVES\]:\s*(\d+)",out)),
          }
          (d/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("COCKTAIL_FINAL_CANDIDATE",json.dumps(result,sort_keys=True))
          if rc != 0:
              raise SystemExit("final candidate still timed out")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cocktail-final-candidate-results
          path: |
            candidate/
            candidate-witness/
