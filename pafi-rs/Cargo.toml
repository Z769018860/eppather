[package]
name = "pafi-rs"
version = "0.0.0"
edition = "2021"
authors = ["ZRZ <zhaorz@ios.ac.cn>"]

[dependencies]
clang = { version = "2.0.0", features = ["clang_10_0", "runtime"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
anyhow = "1.0.92"
scraper = "0.21.0"
lazy_static = "1.5.0"
z3 = "0.12"

[dev-dependencies]
serial_test = "3.2.0"

[profile.dev]
debug = true